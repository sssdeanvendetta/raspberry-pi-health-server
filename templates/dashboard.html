<!DOCTYPE html>
<html>
<body>


<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

{% extends "base.html" %}

{% block content %}
<h2>Dashboard</h2>

<div style="width: 700px; height: 350px; margin: auto;">
  <canvas id="myChart"></canvas>
</div>



<div style="text-align:center; margin-bottom:20px;">
  <button onclick="loadChart('sugar')">Blood Sugar</button>
  <button onclick="loadChart('bp')">Blood Pressure</button>
  <button onclick="loadChart('weight')">Weight</button>
</div>


<div style="width: 700px; height: 350px; margin: auto;">
  <canvas id="myChart"></canvas>
</div>

<style>
button {
  padding: 10px 20px;
  margin: 5px;
  border: none;
  background-color: #007bff;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}

button:hover {
  background-color: #0056b3;
}
</style>

<canvas id="myChart"></canvas>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let chart;

// GLOBAL data storage
let labels = [];
let sugar = [];
let systolic = [];
let diastolic = [];
let weight = [];

// Format date nicely
function formatDate(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-US', {
    month: 'short',
    day: 'numeric'
  });
}

// Load data once
function loadData() {
  fetch('/data')
    .then(res => res.json())
    .then(data => {

      labels = data.map(item => formatDate(item.date_time));
      sugar = data.map(item => item.blood_sugar_mg_dl);
      systolic = data.map(item => item.systolic);
      diastolic = data.map(item => item.diastolic);
      weight = data.map(item => item.weight_lb);

      // Load default chart
      loadChart('sugar');
    });
}

// Switch chart
function loadChart(type) {
  let chartData;
  let chartLabel;

  if (type === 'sugar') {
    chartData = sugar;
    chartLabel = "Blood Sugar";
  } else if (type === 'bp') {
    chartData = systolic;
    chartLabel = "Systolic BP";
  } else if (type === 'weight') {
    chartData = weight;
    chartLabel = "Weight";
  }

  if (chart) {
    chart.destroy();
  }

  const ctx = document.getElementById('myChart').getContext('2d');

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: chartLabel,
        data: chartData,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
}

loadData();
</script></body>

{% endblock %}
</html>
